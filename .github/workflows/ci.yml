name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Real Redis müqavilə testləri yalnız bu sirlər təyin olunduqda işləyir (ayrıca test bazası).
      REDIS_TEST_URL: ${{ secrets.REDIS_TEST_URL }}
      REDIS_TEST_TOKEN: ${{ secrets.REDIS_TEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
